name: codeql

on:
  pull_request:
  push:
    branches: [dev]
  schedule:
    - cron: '0 5 * * 1' # weekly

# `analyze` overrides this with the scopes it needs; this is the floor any job
# added later inherits instead of the repository default token.
permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6.1.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 #v4.38.2
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 #v4.38.2
        with:
          category: '/language:${{ matrix.language }}'
