name: publish-casper-js-sdk

on:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false # never cancel a run that may already have published

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6.1.0
        with:
          fetch-depth: 0 # needed for `git describe` (previous tag) and the dev-ancestry guard

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 #v6.5.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `.npmrc` sets ignore-scripts=true; this runs only what the
      # `lavamoat.allowScripts` allowlist permits (currently nothing).
      - name: Run allowed dependency scripts
        run: npx allow-scripts

      - name: Verify the tag sits on dev
        run: |
          git fetch --no-tags origin dev
          git merge-base --is-ancestor "$GITHUB_SHA" origin/dev \
            || { echo "::error::tag ${GITHUB_REF_NAME} is not an ancestor of dev"; exit 1; }

      - name: Pre-flight
        run: |
          # 1. the tag must match the version actually being published.
          #    npm publishes package.json's `version`, NOT the tag — there is no link between them.
          pkg=$(node -p "require('./package.json').version")
          [ "$pkg" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::tag $GITHUB_REF_NAME != package.json version $pkg"; exit 1; }

          # 2. fail fast if the version is already on npm, instead of burning a full
          #    build + prepublishOnly test run only to hit EPUBLISHCONFLICT (403) at the end.
          #    `npm view pkg@version` exits 0 when it exists and exits 1 (E404) when it does not,
          #    so it MUST be wrapped in `if`, or GitHub's `bash -e` kills the step on the healthy path.
          if npm view "casper-js-sdk@$GITHUB_REF_NAME" version >/dev/null 2>&1; then
            echo "::error::casper-js-sdk@$GITHUB_REF_NAME is already published"; exit 1
          fi

      - name: Build
        run: npm run build

      # These three used to ride along on `prepublishOnly`. They cannot any
      # more: ignore-scripts=true means npm skips that hook, so the release
      # would otherwise publish whatever `dist/` happened to contain. Running
      # them here also fails the tag before anything is uploaded, rather than
      # halfway through the publish step.
      - name: Unit tests
        run: npm run test:node:unit

      - name: Package shape
        run: npm run check:package

      - name: Public API tripwire
        run: npm run api:check

      - name: Bundle budgets
        run: npm run size:check

      # What is inside the release, next to the provenance attestation that says
      # who built it. `--omit dev` narrows it to the 48 packages a consumer
      # actually resolves. The reason to publish it is a repeat of `inflight`:
      # that advisory carried no GHSA, so `npm audit` reported zero while the
      # package shipped to everyone, and answering "which releases contained
      # it?" meant reconstructing old dependency trees by hand.
      - name: Generate SBOM
        run: npm sbom --sbom-format cyclonedx --omit dev > casper-js-sdk.sbom.json

      - name: Extract release notes from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }} # for the `gh api` contributor lookup below
        run: |
          awk -v v="$GITHUB_REF_NAME" '
            $0 ~ "^### \\[" v "\\]" { on = 1; next }
            on && /^### \[[0-9]/     { exit }
            on                       { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md \
            || { echo "::error::no CHANGELOG.md entry for $GITHUB_REF_NAME"; exit 1; }
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^") || prev=''
          if [ -n "$prev" ]; then
            printf '\n\n**Full Changelog**: %s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> RELEASE_NOTES.md
            contributors=$(gh api "repos/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME" \
              --jq '.commits[].author.login // empty' \
              | grep -v '\[bot\]$' | sort -u \
              | awk '{ printf "%s@%s", (NR > 1 ? ", " : ""), $0 }')   # NOT `paste -sd', '`: paste
                                                                     # cycles its delimiter list and
                                                                     # emits `a,b c` for 3+ entries
            # `if`, not `[ … ] && printf`: as the trailing statement of a `bash -e` script the
            # latter exits 1 when there is no linked author to credit, failing an otherwise fine step.
            if [ -n "$contributors" ]; then
              printf '\n**Contributors**: %s\n' "$contributors" >> RELEASE_NOTES.md
            fi
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: publish-artifacts
          path: |
            dist/
            RELEASE_NOTES.md
            casper-js-sdk.sbom.json
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    environment: npm-publish

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 #v6.5.0
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm for OIDC
        run: |
          npm install -g npm@11.5.1
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run allowed dependency scripts
        run: npx allow-scripts

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 #v4.3.0
        with:
          name: publish-artifacts

      # --provenance signs the tarball with the job's OIDC identity (hence
      # `id-token: write` above), so npmjs.com can attest which repo, workflow
      # and commit produced it. A stolen publish token no longer buys a
      # convincing release.
      - name: Publish to npm
        run: npm publish --access public --tag latest --provenance

      # The tag name reaches the shell through `env:`, not `${{ }}` interpolation:
      # GitHub does not sanitise ref names, and this job holds `id-token: write`.
      - name: Rename package
        env:
          REF_NAME: ${{ github.ref_name }}
        run: cp dist/lib.node.js "casper-js-sdk.v${REF_NAME}.js"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 #v2.6.2
        with:
          name: Casper JS SDK v${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            casper-js-sdk.v${{ github.ref_name }}.js
            casper-js-sdk.sbom.json
