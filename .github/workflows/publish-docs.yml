name: Publish docs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@2541b1294d2704b0964813337f33b291d3f8596b #v3.0.2
      - name: Use Node.js 22
        uses: actions/setup-node@5b949b50c3461bbcd5a540b150c368278160234a #v3.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install and Build 🔧
        run: |
          npm ci
          # The root .npmrc sets ignore-scripts=true; this runs the allowlisted ones.
          # It does not reach into site/, which npm treats as its own project, so
          # that tree still runs its dependencies' install scripts.
          npx allow-scripts
          npm run docs:build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 #v4.9.0
        with:
          folder: docs # The folder the action should deploy.
