name: Publish docs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install and Build 🔧
        run: |
          npm ci
          # The root .npmrc sets ignore-scripts=true; this runs the allowlisted ones.
          # It does not reach into site/, which npm treats as its own project, so
          # that tree still runs its dependencies' install scripts.
          npx allow-scripts
          npm run docs:build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 #v4.9.0
        with:
          folder: docs # The folder the action should deploy.
