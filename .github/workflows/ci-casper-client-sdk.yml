name: ci-casper-js-sdk

on:
  workflow_dispatch:

  push:
    branches:
      - 'dev'
      - 'feat-*'
      - 'release-*'
      - 'condor'
    paths-ignore:
      - '**.md'

  pull_request:
    branches:
      - 'dev'
      - 'feat-*'
      - 'release-*'
      - 'condor'
    paths-ignore:
      - '**.md'

jobs:
  # The maintained legs: they run the whole dev toolchain. Node 18 is handled by
  # `node18-consumer` below — from PHASE-3 it can no longer run the dev suite at
  # all (vitest@4 engines: ^20 || ^22 || >=24).
  build:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      FAUCET_PRIV_KEY: 'MC4CAQAwBQYDK2VwBCIEIM0OhegYkU4zxgXeZggBdAR6+XkByue+3iZbznGbCUkM' #ci/test-assets/secret-key.pem
      NODE_URL: 'http://3.20.57.210:7777/rpc'
      HTTP_EVENT_STREAM_URL: 'http://3.20.57.210:9999/events'
      HTTPS_EVENT_STREAM_URL: 'https://events.mainnet.casperlabs.io/events/main'
      NETWORK_NAME: 'dev-net'
      RUST_LOG: 'INFO'
      VERSION_QUERY: '{"jsonrpc": "2.0", "id": "1", "method": "info_get_status"}'
      MAINNET_NODE_URL: 'https://rpc.mainnet.casperlabs.io/rpc'
      TESTNET_NODE_URL: 'https://rpc.testnet.casperlabs.io/rpc'

    steps:
      - name: Checkout
        uses: actions/checkout@2541b1294d2704b0964813337f33b291d3f8596b #v3.0.2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@5b949b50c3461bbcd5a540b150c368278160234a #v3.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install
        run: npm install

      - name: Audits
        run: npm audit --omit=dev

      - name: Lints
        run: npm run lint:ci

      - name: Knip (dead & phantom dependencies)
        run: npm run knip

      - name: Unit Test (node)
        run: npm run test:node:unit -- --reporter=default --reporter=json --outputFile.json=reports/node-unit.json

      # A green exit code only says nothing failed, not that everything ran.
      # See scripts/assert-test-count.js for why that distinction has teeth here.
      - name: Assert the node suite ran the whole file set
        run: node scripts/assert-test-count.js reports/node-unit.json "node unit"

      # Browser mode drives a real Chromium. This is the first CI run of the
      # browser suite: the karma setup it replaces preprocessed globs that no
      # test file had matched since 2025-01, and the workflow never invoked it.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit Test (browser)
        run: npm run test:browser:unit -- --reporter=default --reporter=json --outputFile.json=reports/browser-unit.json

      - name: Assert the browser suite ran the whole file set
        run: node scripts/assert-test-count.js reports/browser-unit.json "browser unit"

      - name: Test build
        run: npm run build

      # The tarball the Node 18 job consumes. Built here because the build
      # toolchain (webpack-cli@7, eslint@10) needs Node >=20.9.
      - name: Pack
        if: matrix.node-version == '22.x'
        run: npm pack --pack-destination ./pack

      - name: Upload tarball
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: ./pack/*.tgz
          retention-days: 1

  # The consumer-compatibility leg for the published `engines.node ">=18"`.
  # It installs the built tarball into a clean project and runs it with plain
  # `node`, which is what a Node 18 consumer actually does — and what the dev
  # suite never covered, since that suite runs TypeScript sources and never
  # touches `dist/`.
  node18-consumer:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@2541b1294d2704b0964813337f33b291d3f8596b #v3.0.2

      - name: Use Node.js 18.x
        uses: actions/setup-node@5b949b50c3461bbcd5a540b150c368278160234a #v3.4.0
        with:
          node-version: 18.x

      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: package-tarball
          path: ./pack

      - name: Install the tarball into a clean project
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cp ./pack/*.tgz "$RUNNER_TEMP/consumer/"
          cp scripts/smoke.js "$RUNNER_TEMP/consumer/"
          cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          # --engine-strict, or this job cannot fail on the thing it exists to
          # prove: npm defaults to engine-strict=false, so a dependency whose
          # engines.node excludes 18 only warns EBADENGINE, installs anyway and
          # exits 0.
          npm install --engine-strict ./*.tgz

      - name: Smoke test the published artifact
        run: node "$RUNNER_TEMP/consumer/smoke.js"
        working-directory: ${{ runner.temp }}/consumer

  # `@types/node` had to move to ^22 for vitest@4, so the build no longer proves
  # that `src` stays inside the API surface Node 18 actually has. This job puts
  # the 18.x typings back in front of the compiler. It installs them into a
  # throwaway directory rather than the project's own tree, which keeps vitest's
  # peer range satisfied and leaves node_modules alone.
  node18-typings:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@2541b1294d2704b0964813337f33b291d3f8596b #v3.0.2

      - name: Use Node.js 22.x
        uses: actions/setup-node@5b949b50c3461bbcd5a540b150c368278160234a #v3.4.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install
        run: npm install

      - name: Fetch the Node 18 typings floor
        run: |
          mkdir -p "$RUNNER_TEMP/node18-types"
          cd "$RUNNER_TEMP/node18-types"
          npm init -y >/dev/null
          npm install --no-audit --no-fund '@types/node@^18'

      - name: Type-check src against @types/node@18
        run: npx tsc -p tsconfig.node18.json --typeRoots "$RUNNER_TEMP/node18-types/node_modules/@types"
