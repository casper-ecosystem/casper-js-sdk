name: ci-casper-js-sdk

on:
  workflow_dispatch:

  push:
    branches:
      - 'dev'
      - 'feat-*'
      - 'release-*'
      - 'condor'
    paths-ignore:
      - '**.md'

  pull_request:
    branches:
      - 'dev'
      - 'feat-*'
      - 'release-*'
      - 'condor'
    paths-ignore:
      - '**.md'

permissions:
  contents: read

# Branch protection on `dev` requires exactly one status check — `mergefreeze`.
# None of the jobs below is required, so the guards in here fail loudly but do
# not block a merge on their own; a human reading the run decides what that
# means. To make them required, the check names are `build (22.x, ubuntu-22.04)`,
# `build (24.x, ubuntu-22.04)`, `node18-consumer` and `node18-typings`.
jobs:
  # The maintained legs: they run the whole dev toolchain. Node 18 cannot run
  # that suite at all (vitest@4 engines: ^20 || ^22 || >=24) and is covered by
  # `node18-consumer` below.
  build:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      FAUCET_PRIV_KEY: 'MC4CAQAwBQYDK2VwBCIEIM0OhegYkU4zxgXeZggBdAR6+XkByue+3iZbznGbCUkM' #ci/test-assets/secret-key.pem
      NODE_URL: 'http://3.20.57.210:7777/rpc'
      HTTP_EVENT_STREAM_URL: 'http://3.20.57.210:9999/events'
      HTTPS_EVENT_STREAM_URL: 'https://events.mainnet.casperlabs.io/events/main'
      NETWORK_NAME: 'dev-net'
      RUST_LOG: 'INFO'
      VERSION_QUERY: '{"jsonrpc": "2.0", "id": "1", "method": "info_get_status"}'
      MAINNET_NODE_URL: 'https://rpc.mainnet.casperlabs.io/rpc'
      TESTNET_NODE_URL: 'https://rpc.testnet.casperlabs.io/rpc'

    steps:
      - name: Checkout
        uses: actions/checkout@2541b1294d2704b0964813337f33b291d3f8596b #v3.0.2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@5b949b50c3461bbcd5a540b150c368278160234a #v3.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install
        run: npm install

      # `.npmrc` sets ignore-scripts=true, so the install above runs no
      # dependency lifecycle script at all — the npm attack that needs no
      # cooperation from this repo's code. This then runs the ones the
      # `lavamoat.allowScripts` allowlist permits, which is currently none.
      - name: Run allowed dependency scripts
        run: npx allow-scripts

      - name: Audits
        run: npm audit --omit=dev

      # Advisories are only half of it: this checks that every package in the
      # installed tree carries a valid registry signature, which is what catches
      # a tarball swapped out from under a version that already resolved.
      - name: Registry signatures and provenance attestations
        run: npm audit signatures

      - name: Lints
        run: npm run lint:ci

      - name: Knip (dead & phantom dependencies)
        run: npm run knip

      - name: Unit Test (node)
        run: npm run test:node:unit -- --reporter=default --reporter=json --outputFile.json=reports/node-unit.json

      # A green exit code only says nothing failed, not that everything ran.
      # See scripts/assert-test-count.js for why that distinction has teeth here.
      - name: Assert the node suite ran the whole file set
        run: node scripts/assert-test-count.js reports/node-unit.json "node unit"

      # Vitest browser mode drives a real Chromium, so the binary must be here.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit Test (browser)
        run: npm run test:browser:unit -- --reporter=default --reporter=json --outputFile.json=reports/browser-unit.json

      - name: Assert the browser suite ran the whole file set
        run: node scripts/assert-test-count.js reports/browser-unit.json "browser unit"

      - name: Test build
        run: npm run build

      # Reads `dist/*.d.ts`, so it has to follow the build. Fails when the
      # emitted public surface differs from the committed report, which makes a
      # breaking change impossible to land without a reviewable diff of
      # `etc/casper-js-sdk.api.md`. Regenerate with `npm run api:update`.
      - name: Public API tripwire
        run: npm run api:check

      # webpack's own size warning has never failed a build. This does, which
      # matters most for `lib.web.js`: it ships to browser wallets, and the
      # dependency swaps v6 is built around are exactly where a stray import
      # can pull a whole library into it without breaking a single test.
      - name: Bundle budgets
        run: npm run size:check

      # This is a dual Node/browser CJS package that already had to revert one
      # ESM attempt, so the packaging is checked rather than assumed: publint on
      # the manifest, attw on whether the declarations resolve the same way the
      # runtime entries do, and a consumer-shaped type-check with no @types/node.
      #
      # attw's `named-exports` rule is ignored, and that ignore is a finding, not
      # a shrug: none of the 440 named exports is statically detectable in the
      # webpack bundle, so `import { PublicKey } from 'casper-js-sdk'` under Node
      # ESM resolves the types and then crashes at runtime. Fixing it is the
      # whole point of the ESM packaging phase; until then the rule would mask
      # every other regression this step exists to catch. Drop the ignore there.
      - name: Package shape
        run: npm run check:package

      # The tarball the Node 18 job consumes. Built here because the build
      # toolchain (webpack-cli@7, eslint@10) needs Node >=20.9.
      - name: Pack
        if: matrix.node-version == '22.x'
        # npm 10, the version Node 22 bundles, does not create
        # `--pack-destination` itself and fails with ENOENT on the tarball.
        run: |
          mkdir -p ./pack
          npm pack --pack-destination ./pack

      - name: Upload tarball
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: package-tarball
          path: ./pack/*.tgz
          retention-days: 1

  # The consumer-compatibility leg for the published `engines.node ">=18"`.
  # The dev suite runs TypeScript sources and never touches `dist/`, so this job
  # is the only thing proving the published tarball installs and runs under a
  # plain Node 18.
  node18-consumer:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@2541b1294d2704b0964813337f33b291d3f8596b #v3.0.2

      - name: Use Node.js 18.x
        uses: actions/setup-node@5b949b50c3461bbcd5a540b150c368278160234a #v3.4.0
        with:
          node-version: 18.x

      - name: Download tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 #v4.3.0
        with:
          name: package-tarball
          path: ./pack

      - name: Install the tarball into a clean project
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cp ./pack/*.tgz "$RUNNER_TEMP/consumer/"
          cp scripts/smoke.js "$RUNNER_TEMP/consumer/"
          cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          # --engine-strict, or this job cannot fail on what it exists to prove:
          # npm defaults to engine-strict=false, so a dependency whose
          # engines.node excludes 18 only warns EBADENGINE and installs anyway.
          npm install --engine-strict ./*.tgz

      - name: Smoke test the published artifact
        run: node "$RUNNER_TEMP/consumer/smoke.js"
        working-directory: ${{ runner.temp }}/consumer

  # `@types/node` is on ^22 for vitest@4, so the build no longer proves `src`
  # stays inside the API surface Node 18 actually has; this job puts the 18.x
  # typings back in front of the compiler. They go into a throwaway directory —
  # installing them into the project tree would break vitest's peer range.
  node18-typings:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@2541b1294d2704b0964813337f33b291d3f8596b #v3.0.2

      - name: Use Node.js 22.x
        uses: actions/setup-node@5b949b50c3461bbcd5a540b150c368278160234a #v3.4.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install
        run: npm install

      - name: Fetch the Node 18 typings floor
        run: |
          mkdir -p "$RUNNER_TEMP/node18-types"
          cd "$RUNNER_TEMP/node18-types"
          npm init -y >/dev/null
          npm install --no-audit --no-fund '@types/node@^18'

      - name: Type-check src against @types/node@18
        run: npx tsc -p tsconfig.node18.json --typeRoots "$RUNNER_TEMP/node18-types/node_modules/@types"
