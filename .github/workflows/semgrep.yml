name: semgrep

on:
  pull_request:
  push:
    branches: [dev, master]
  schedule:
    - cron: '0 4 * * 1' # weekly, catches new registry rules

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Semgrep scan
        run: >
          semgrep scan --error
          --config p/default
          --config p/typescript
          --config p/nodejs
          --config .semgrep/
          --exclude dist
          --exclude docs
          --exclude site
          --exclude node_modules
