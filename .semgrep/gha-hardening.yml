# Workflow-level supply-chain invariants. Every workflow already satisfies these;
# the rules keep them true as workflows are edited.
rules:
  - id: require-sha-pinned-actions
    languages: [yaml]
    severity: ERROR
    message: >-
      Pin actions to a full 40-character commit SHA (with the version as a
      trailing comment). A tag is mutable — whoever controls the action's repo
      can move it onto code that reads this workflow's secrets.
    patterns:
      - pattern-regex: 'uses:\s*[A-Za-z0-9_.-]+/[^\s@]+@\S+'
      - pattern-not-regex: 'uses:\s*[A-Za-z0-9_.-]+/[^\s@]+@[0-9a-f]{40}'
    paths:
      include:
        - '/.github/workflows/**'

  - id: require-explicit-permissions
    languages: [yaml]
    severity: ERROR
    message: >-
      Workflow declares no top-level `permissions:`, so its jobs fall back to
      the repository default token, which can be write on every scope. Set
      `permissions: contents: read` at the top and widen it per job.
    patterns:
      # The match has to span the whole file: pattern-not-regex only discards a
      # result when its regex hits inside the matched range, and the key we are
      # asserting the absence of can sit anywhere in the document.
      - pattern-regex: '(?s)\A.+\z'
      - pattern-not-regex: '(?m)^permissions:'
    paths:
      include:
        - '/.github/workflows/**'

  - id: no-untrusted-interpolation-in-run
    languages: [yaml]
    severity: ERROR
    message: >-
      Attacker-controlled github.event data interpolated into a shell command —
      a PR title or branch name becomes code running in the job. Pass it through
      an `env:` binding and reference "$VAR" instead.
    pattern-regex: 'run:[^\n]*\$\{\{\s*github\.(event|head_ref)'
    paths:
      include:
        - '/.github/**'
